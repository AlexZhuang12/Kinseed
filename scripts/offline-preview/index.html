<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kinseed｜背景工作獨立預覽</title><link rel="stylesheet" href="style.css"><script src="app.js" defer></script><body><header><p class="eyebrow">KINSEED · 獨立合成預覽</p><h1>工作交出去，進度仍看得見。</h1><p>查詢原工作、補齊紀錄。這裡沒有生成或重新提交功能。</p><div class="badge">只含虛構資料 · 不連線真實模型或付費服務</div></header><main><nav aria-label="合成個體"><button data-owner="synthetic-a" class="selected">合成個體甲</button><button data-owner="synthetic-b">合成個體乙</button></nav><section class="flow"><div><span>01</span><b>看目前狀態</b><p>是否已接受？成果是否完成？</p></div><div><span>02</span><b>查原工作</b><p>使用已有識別碼，不再送一份。</p></div><div><span>03</span><b>確認收尾</b><p>成果、B 紀錄與帳務分開核對。</p></div></section><section class="toolbar"><div><h2>這個個體的背景工作</h2><p id="policy"></p></div><button id="refresh" class="secondary">重新讀取狀態</button><button id="tick" class="primary">執行本次允許的查詢</button></section><p id="message" role="status" aria-live="polite"></p><div id="jobs"></div><aside><h2>合成情境操作</h2><p>下列只改這份預覽的虛構狀態，不會操作正式生活。</p><div class="actions"><button data-event="window-closed">模擬時段外</button><button data-event="window-open">模擬進入時段</button><button data-event="owner-stop">模擬 Owner 叫停</button><button data-event="owner-resume">模擬 Owner 解除停止</button><button data-event="sinks-recovered">模擬補記服務恢復</button></div><button id="reconcile" class="primary">補記已有結果</button><p>補記只處理已保存的紀錄；不生成、不重送、不加開生活。</p></aside><footer id="counts"></footer></main></body></html>
